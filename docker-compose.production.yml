# Production overlay.
#
# Ports bind to 127.0.0.1 only, so nothing reaches the app except through the
# reverse proxy on the same host. Published as "3000:3000" they would listen on
# 0.0.0.0 and be reachable directly at http://<server-ip>:3000, bypassing nginx
# — which means no TLS, no rate limiting done at the edge, and a second origin
# that CORS_ALLOWED_ORIGINS does not cover.
#
# Consequence: with this in effect the stack is ONLY reachable through the
# proxy. Do not deploy this before nginx is actually proxying, or the app will
# appear to be down.
#
# Container/volume isolation from staging comes from the Compose project name
# (-p), supplied by the deploy workflow — not from anything in this file.
services:
  backend:
    ports:
      - "127.0.0.1:5000:5000"
    # Prometheus onboarding. The monitoring hub at /opt/vps-monitoring discovers
    # targets through the Docker socket and scrapes only containers that opt in
    # with these labels, so this is the whole of it: no scrape config to edit and
    # nothing to reload. See its README, "Onboarding a project".
    #
    # metrics.port is 9464, the backend's own metrics listener, not 5000. That
    # port is published to nothing, so /metrics is reachable from this network
    # and from nowhere else; see backend/src/utils/metrics.js.
    networks:
      - default
      - metrics
    labels:
      metrics.scrape: "true"
      metrics.project: "talyer-production"
      metrics.port: "9464"
      metrics.name: "backend"

  frontend:
    ports:
      - "127.0.0.1:3000:3000"

# Created once on the host with `docker network create metrics`. External so
# that this stack joins the shared network rather than creating a second one
# Prometheus cannot see.
networks:
  metrics:
    external: true


name: Dependabot auto-merge

# Merges low-risk Dependabot pull requests once CI has actually passed.
#
# Why workflow_run and not pull_request_target: a workflow triggered by the
# pull request itself shows up as a check *on* that pull request. If such a job
# waited for the pull request's checks to finish, it would be waiting for
# itself and deadlock until the job timed out. Keying off CI's completion
# sidesteps that entirely — by the time this runs, CI has a verdict.
#
# Why `gh pr merge --squash` and not `--auto`: `--auto` only defers the merge
# until required status checks pass, and required checks only exist when branch
# protection is configured. Without it, `--auto` merges immediately and the
# "wait for CI" intent silently evaporates. Merging directly, after this
# workflow has confirmed CI succeeded, holds regardless of branch protection.
#
# Scope is deliberately narrow. Only the Dependabot groups defined in
# dependabot.yml that carry non-breaking updates are eligible. Major-version
# groups and any ungrouped single-package update are left for a human, because
# a green CI run is not sufficient evidence that a major upgrade is safe — see
# the redis 6 evaluation, where the suite passed while never once connecting to
# a real Redis.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'

    steps:
      - name: Resolve the pull request for this run
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          number=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" \
            --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            echo "No open pull request for branch $HEAD_BRANCH; nothing to merge."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Resolved branch $HEAD_BRANCH to pull request #$number"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Decide whether this update is eligible
        id: eligible
        if: steps.pr.outputs.found == 'true'
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          # Dependabot names grouped branches
          # dependabot/<ecosystem>/<directory>/<group-name>-<hash>, so the group
          # name from dependabot.yml appears verbatim in the branch. Anything
          # that is not one of these groups — including *-major and every
          # ungrouped single-package update — is deliberately not eligible.
          case "$HEAD_BRANCH" in
            *"/backend-minor-patch-"*|\
            *"/frontend-minor-patch-"*|\
            *"/backend-docker-"*|\
            *"/frontend-docker-"*|\
            *"/github-actions-"*)
              echo "Branch $HEAD_BRANCH is a non-breaking Dependabot group."
              echo "ok=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Branch $HEAD_BRANCH is not an auto-merge group; leaving it for review."
              echo "ok=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Wait for every other check to reach a terminal success
        id: checks
        if: steps.eligible.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          SELF_CHECK: auto-merge
          TIMEOUT_SECONDS: '1800'
          POLL_SECONDS: '30'
        run: |
          set -uo pipefail
          # CI succeeded — that is what triggered this run — but the Security
          # workflow reports independently, and its jobs (codeql, and both
          # image-scan legs) finish well after CI does. The previous gate counted
          # only FAILURE and ERROR, so a still-queued CodeQL run contributed
          # nothing to the count. Absence of failure is not success: require a
          # terminal success from every check, and wait for the ones still going.
          #
          # `gh pr checks` sets its exit code from the aggregate check state, so
          # its non-zero exits are tolerated here and the verdict is taken from
          # the JSON instead. This job's own check run is excluded, or it would
          # wait on itself and time out.
          deadline=$(( SECONDS + TIMEOUT_SECONDS ))
          while :; do
            checks=$(gh pr checks "$PR" --repo "$REPO" --json name,state 2>/dev/null || true)
            if [ -z "$checks" ]; then
              echo "Could not read check runs for #$PR; refusing to merge."
              echo "ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            others=$(echo "$checks" | jq --arg self "$SELF_CHECK" '[.[] | select(.name != $self)]')
            failing=$(echo "$others" | jq '[.[] | select(.state == "FAILURE" or .state == "ERROR")] | length')
            unfinished=$(echo "$others" | jq '[.[] | select(.state != "SUCCESS" and .state != "SKIPPED" and .state != "NEUTRAL" and .state != "FAILURE" and .state != "ERROR")] | length')

            if [ "$failing" != "0" ]; then
              echo "$others" | jq -r '.[] | select(.state == "FAILURE" or .state == "ERROR") | "failing: \(.name)"'
              echo "ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$unfinished" = "0" ]; then
              echo "Every check reached a terminal success."
              echo "ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "$others" | jq -r '.[] | select(.state != "SUCCESS" and .state != "SKIPPED" and .state != "NEUTRAL") | "still pending: \(.name) (\(.state))"'
              echo "Timed out after ${TIMEOUT_SECONDS}s. Leaving #$PR unmerged for a human."
              exit 1
            fi

            echo "$others" | jq -r '.[] | select(.state != "SUCCESS" and .state != "SKIPPED" and .state != "NEUTRAL") | "waiting on: \(.name) (\(.state))"'
            sleep "$POLL_SECONDS"
          done

      - name: Squash merge
        if: steps.checks.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR" --repo "$REPO" --squash --delete-branch
          echo "Merged pull request #$PR"

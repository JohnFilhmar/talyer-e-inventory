version: 2

# Grouping policy
#
# The first version of this file grouped only minor and patch updates, which
# left every major bump to open its own pull request. The initial scan produced
# 16 PRs — 2 grouped and 14 individual majors. Grouping majors as well keeps the
# weekly volume to roughly one PR per ecosystem.
#
# Minor/patch and major are deliberately kept in separate groups: the
# minor/patch PR is meant to be reviewed quickly and merged, while the major PR
# collects breaking changes that need real work and can sit until someone has
# time for them. Mixing the two would hold the safe updates hostage to the risky
# ones.
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
      backend-major:
        update-types: [major]
    ignore:
      # mongoose 9.10 requires mongodb driver ~7.6, whose handshake fails under
      # Jest ("Missing required sub-document 'driver' in the client metadata
      # document"), so every DB-backed suite times out. Plain node is fine.
      # Upstream fix: NODE-7832 (mongodb/node-mongodb-native#5059). Drop this
      # once a mongoose release depends on a driver that contains it.
      - dependency-name: mongoose
        versions: [">=9.10.0"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
      frontend-major:
        update-types: [major]
    ignore:
      # typescript-eslint, which eslint-config-next pulls in, supports
      # TypeScript below 6.1 and aborts lint on 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # eslint-plugin-react, -import and -jsx-a11y inside eslint-config-next
      # stop their eslint peer range at ^9.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # Tracks the node:22 runtime in the Dockerfile, which moves LTS lines
      # deliberately (see the docker entries below), not to the newest types.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  # Expo mobile app.
  #
  # The Expo SDK controls `expo`, `react-native`, `react`, `react-dom` and every
  # `expo-*` and `react-native-*` package as one set: `expo install --fix` puts
  # each of them at the version the installed SDK expects, which is why they are
  # written with `~` ranges. Bumping any one of them past that range on its own
  # leaves the app off-SDK. So every SDK-controlled package is held below a
  # minor here, since an SDK bump is a migration someone runs deliberately
  # through `expo install --fix`, not a pull request to review. Holding them
  # below a major only was not enough: a minor react-native-reanimated needed a
  # newer react-native and broke `npm ci`. The SDK also owns packages outside
  # the `expo-*`/`react-native-*` patterns (the presets, async-storage), and
  # pins jest, babel and eslint to the majors those presets support. Everything
  # the SDK does not own, axios and the react-query packages for example,
  # updates normally.
  #
  # These pull requests are deliberately NOT auto-merged; see the group
  # allow-list in dependabot-auto-merge.yml for why.
  - package-ecosystem: npm
    directory: /mobile-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      mobile-app-minor-patch:
        update-types: [minor, patch]
      mobile-app-major:
        update-types: [major]
    ignore:
      - dependency-name: expo
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: react-native
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: expo-*
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: react-native-*
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: "@react-native/*"
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: "@react-native-async-storage/async-storage"
        update-types: [version-update:semver-major, version-update:semver-minor]
      # Every react update, patches too: React Native requires `react` to equal
      # the version of the renderer it bundles and throws "Incompatible React
      # versions" at startup otherwise. mobile-check never starts the app, so
      # CI stays green on a bump that crashes on launch.
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: babel-preset-expo
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: jest-expo
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: eslint-config-expo
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: jest
        update-types: [version-update:semver-major]
      - dependency-name: "@types/jest"
        update-types: [version-update:semver-major]
      - dependency-name: "@babel/core"
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # nativewind 4 runs on react-native-css-interop, which peers on
      # tailwindcss ~3.
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      # TypeScript 7 left the tree still needing 5.9.3 and npm ci failed
      # ("Missing: typescript@5.9.3 from lock file"). Held with the frontend's.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  # Docker base images.
  #
  # Node major bumps are ignored on purpose. Dependabot offers whatever tag is
  # newest, which includes odd-numbered releases (25, 27, ...) that are "current"
  # rather than LTS and stop receiving fixes within months. Both Dockerfiles are
  # pinned to node:22-alpine ("Jod", LTS). Moving to another LTS line — 24
  # ("Krypton") is the active one — should be a deliberate change that re-runs
  # the suite and rebuilds both images, not an automatic PR.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-docker:
        patterns: ["*"]
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-docker:
        patterns: ["*"]
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

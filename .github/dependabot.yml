version: 2

# Grouping policy
#
# The first version of this file grouped only minor and patch updates, which
# left every major bump to open its own pull request. The initial scan produced
# 16 PRs — 2 grouped and 14 individual majors. Grouping majors as well keeps the
# weekly volume to roughly one PR per ecosystem.
#
# Minor/patch and major are deliberately kept in separate groups: the
# minor/patch PR is meant to be reviewed quickly and merged, while the major PR
# collects breaking changes that need real work and can sit until someone has
# time for them. Mixing the two would hold the safe updates hostage to the risky
# ones.
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
      backend-major:
        update-types: [major]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
      frontend-major:
        update-types: [major]

  # Expo mobile app.
  #
  # The Expo SDK controls `expo`, `react-native`, `react`, `react-dom` and every
  # `expo-*` and `react-native-*` package as one set: `expo install --fix` puts
  # each of them at the version the installed SDK expects, which is why they are
  # written with `~` ranges. Bumping any one of them past that range on its own
  # leaves the app off-SDK, and nothing in CI would notice. So the SDK-controlled
  # packages are held below a major here, and `expo` and `react-native` below a
  # minor as well, since an SDK bump is a migration someone runs deliberately
  # through `expo install --fix`, not a pull request to review. Everything the
  # SDK does not own, axios and the react-query packages for example, updates
  # normally.
  #
  # These pull requests are deliberately NOT auto-merged; see the group
  # allow-list in dependabot-auto-merge.yml for why.
  - package-ecosystem: npm
    directory: /mobile-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      mobile-app-minor-patch:
        update-types: [minor, patch]
      mobile-app-major:
        update-types: [major]
    ignore:
      - dependency-name: expo
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: react-native
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: expo-*
        update-types: [version-update:semver-major]
      - dependency-name: react-native-*
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]

  # Docker base images.
  #
  # Node major bumps are ignored on purpose. Dependabot offers whatever tag is
  # newest, which includes odd-numbered releases (25, 27, ...) that are "current"
  # rather than LTS and stop receiving fixes within months. Both Dockerfiles are
  # pinned to node:22-alpine ("Jod", LTS). Moving to another LTS line — 24
  # ("Krypton") is the active one — should be a deliberate change that re-runs
  # the suite and rebuilds both images, not an automatic PR.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-docker:
        patterns: ["*"]
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-docker:
        patterns: ["*"]
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

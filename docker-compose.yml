services:
  mongo:
    # Memory limit. Sized from the operator's VPS figures (6 cores, 12 GB RAM)
    # and the fact that this box also hosts their other systems, so the two
    # talyer stacks together take 4.5 GB of 12 and leave 7.5 GB for everything
    # else. Staging overrides these downward.
    #
    # Without a limit a leak or a runaway query in either stack can take the
    # whole box with it, including production and the unrelated systems beside
    # it. mongo:7 reads its cgroup limit when sizing the WiredTiger cache, so
    # capping the container is enough; no explicit cacheSizeGB is needed.
    deploy:
      resources:
        limits:
          memory: 1536M
    # Capped and rotated. The default json-file driver has no limit, the
    # backend writes two log lines per request, and staging and production
    # share one VPS: three unbounded disk consumers compound on one box.
    #
    # Memory and CPU limits are the other half of GAP-027 and are deliberately
    # absent: they depend on the VPS specification, which is not in the
    # repository, and a guessed limit can OOM-kill production.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-talyer}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD is required}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    # Memory limit; see the note on the mongo service.
    deploy:
      resources:
        limits:
          memory: 256M
    # Capped and rotated. The default json-file driver has no limit, the
    # backend writes two log lines per request, and staging and production
    # share one VPS: three unbounded disk consumers compound on one box.
    #
    # Memory and CPU limits are the other half of GAP-027 and are deliberately
    # absent: they depend on the VPS specification, which is not in the
    # repository, and a guessed limit can OOM-kill production.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    # Memory limit; see the note on the mongo service.
    deploy:
      resources:
        limits:
          memory: 768M
    # Capped and rotated. The default json-file driver has no limit, the
    # backend writes two log lines per request, and staging and production
    # share one VPS: three unbounded disk consumers compound on one box.
    #
    # Memory and CPU limits are the other half of GAP-027 and are deliberately
    # absent: they depend on the VPS specification, which is not in the
    # repository, and a guessed limit can OOM-kill production.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: ./backend
    restart: unless-stopped
    # Longer than SHUTDOWN_GRACE_MS in server.js, so Compose does not SIGKILL
    # the process midway through draining. A request cut off between the stock
    # save and its StockMovement leaves a hole in the audit trail.
    stop_grace_period: 20s
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_REFRESH_EXPIRE: ${JWT_REFRESH_EXPIRE:-30d}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:5000}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-}
    volumes:
      - backend-uploads:/app/uploads

  frontend:
    # Memory limit; see the note on the mongo service.
    deploy:
      resources:
        limits:
          memory: 512M
    # Capped and rotated. The default json-file driver has no limit, the
    # backend writes two log lines per request, and staging and production
    # share one VPS: three unbounded disk consumers compound on one box.
    #
    # Memory and CPU limits are the other half of GAP-027 and are deliberately
    # absent: they depend on the VPS specification, which is not in the
    # repository, and a guessed limit can OOM-kill production.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:5000}
        NEXT_PUBLIC_IMAGE_HOST: ${NEXT_PUBLIC_IMAGE_HOST:-http://localhost:5000}
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  mongo-data:
  redis-data:
  backend-uploads:

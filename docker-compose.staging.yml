# Staging overlay. Host ports are offset by one (frontend 3001, backend 5001)
# so the staging stack can run alongside production on the same VPS.
# Container/volume isolation from production comes from the Compose project
# name (-p), supplied by the deploy workflow -- not from anything in this
# file.
services:
  # Staging is held to roughly half of production's memory. It exists to catch
  # problems, not to serve customers, and the point of limiting it at all is
  # that a leak here must not be able to starve the production stack or the
  # other systems sharing this box.
  mongo:
    deploy:
      resources:
        limits:
          memory: 768M

  redis:
    deploy:
      resources:
        limits:
          memory: 128M

  backend:
    ports:
      - "5001:5000"
    deploy:
      resources:
        limits:
          memory: 384M
    # Prometheus onboarding. The monitoring hub at /opt/vps-monitoring discovers
    # targets through the Docker socket and scrapes only containers that opt in
    # with these labels, so this is the whole of it: no scrape config to edit and
    # nothing to reload. See its README, "Onboarding a project".
    #
    # metrics.port is 9464, the backend's own metrics listener, not 5000. That
    # port is published to nothing, so /metrics is reachable from this network
    # and from nowhere else; see backend/src/utils/metrics.js.
    networks:
      - default
      - metrics
    labels:
      metrics.scrape: "true"
      metrics.project: "talyer-staging"
      metrics.port: "9464"
      metrics.name: "backend"

  frontend:
    ports:
      - "3001:3000"
    deploy:
      resources:
        limits:
          memory: 256M

# Created once on the host with `docker network create metrics`. External so
# that this stack joins the shared network rather than creating a second one
# Prometheus cannot see.
networks:
  metrics:
    external: true


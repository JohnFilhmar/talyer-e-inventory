# Reference nginx site for a single-domain deployment.
#
# This file is deliberately HTTP-only. `certbot --nginx` rewrites it in place:
# it adds `listen 443 ssl`, the ssl_certificate lines, and a port-80 block that
# redirects to HTTPS — reusing the location blocks below, so the routing is
# preserved.
#
# Shipping a 443 block up front does not work. nginx refuses to load a
# `listen ... ssl` server that has no certificate ("no ssl_certificate is
# defined for the listen ... ssl directive"), and certbot --nginx cannot modify
# a config that will not load. The two deadlock before the first certificate is
# ever issued.
#
# Usage:
#   sudo cp docs/nginx/talyer-production.conf /etc/nginx/sites-available/talyer
#   sudo sed -i 's/REPLACE_ME.example.com/your.real.domain/' \
#     /etc/nginx/sites-available/talyer
#   sudo ln -sf /etc/nginx/sites-available/talyer /etc/nginx/sites-enabled/talyer
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d your.real.domain
#
# Why one domain instead of app.* + api.*:
#   - The refresh token cookie is set with SameSite=Strict in production
#     (backend/src/controllers/authController.js). A single origin makes it
#     unambiguously first-party.
#   - Same origin means the browser never issues a cross-origin request, so the
#     hand-rolled CORS allowlist in server.js stops being load-bearing.
#
# The routing that is easy to get wrong: the backend serves /api/* AND /uploads/*
# from its root (server.js mounts express.static at /uploads, outside the /api
# prefix). Proxy only /api and every product image 404s.

upstream talyer_backend {
    server 127.0.0.1:5000;
}

upstream talyer_frontend {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    listen [::]:80;
    server_name REPLACE_ME.example.com;

    # Product image uploads are capped at 5 MB by multer
    # (backend/src/middleware/imageUpload.js). nginx defaults to 1 MB, which
    # would reject anything larger with a 413 before it ever reaches the app.
    client_max_body_size 10m;
    client_body_buffer_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # Required. TRUST_PROXY=1 makes Express read X-Forwarded-For for req.ip,
    # which is what express-rate-limit keys on — without this header every
    # client would share one bucket. X-Forwarded-Proto is how the app knows the
    # original request was HTTPS.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    # Let the ACME http-01 challenge through untouched, both for the first
    # issuance and for every renewal after certbot adds the HTTPS redirect.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # API. proxy_pass carries no URI part, so the original /api/... path is
    # preserved — which is what the backend expects, since every router is
    # mounted under /api.
    location /api/ {
        proxy_pass http://talyer_backend;
    }

    # Uploaded product images. Served by the backend from its root, NOT under
    # /api. Omitting this block is the single most common way to end up with a
    # working app and no images.
    location /uploads/ {
        proxy_pass http://talyer_backend;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Health endpoint, useful for uptime monitoring.
    location = /health {
        proxy_pass http://talyer_backend;
        access_log off;
    }

    # Everything else is the Next.js app.
    location / {
        proxy_pass http://talyer_frontend;
    }
}
